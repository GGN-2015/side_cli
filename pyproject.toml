[project]
name = "side-cli"
version = "0.2.0"
description = "Supervise a command and bridge its pipes or terminal over local TCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pywinpty>=3.1.2,<4; sys_platform == 'win32'",
    "PySide6-Addons>=6.10.2,<6.11; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
side-cli = "side_cli.cli:main"
side_cli = "side_cli.cli:main"

[project.urls]
Repository = "https://github.com/GGN-2015/side_cli"

[build-system]
requires = ["uv_build>=0.11.0,<0.14.0"]
build-backend = "uv_build"
